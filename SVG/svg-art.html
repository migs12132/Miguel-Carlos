<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Task 5.1 - SVG Art</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f4f8; margin: 0; padding: 20px; color: #222; }
  h1 { text-align: center; margin-bottom: 4px; }
  p.sub { text-align: center; margin-top: 0; color: #555; }
  .gallery { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; }
  figure { margin: 0; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  figcaption { text-align: center; font-size: 14px; margin-top: 8px; font-weight: bold; }
  svg { display: block; border: 1px solid #ccc; }
</style>
</head>
<body>
<h1>Learning Task 5.1: SVG Art</h1>
<p class="sub">Each graphic is 200 &times; 300</p>

<div class="gallery">

  <!-- 1. Line and Circle: Sunrise -->
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <rect width="200" height="300" fill="#ffe8b0"/>
      <circle cx="100" cy="170" r="45" fill="#ff9800" stroke="#e65100" stroke-width="3"/>
      <line x1="100" y1="100" x2="100" y2="70" stroke="#e65100" stroke-width="4"/>
      <line x1="50" y1="120" x2="30" y2="95" stroke="#e65100" stroke-width="4"/>
      <line x1="150" y1="120" x2="170" y2="95" stroke="#e65100" stroke-width="4"/>
      <line x1="35" y1="170" x2="10" y2="170" stroke="#e65100" stroke-width="4"/>
      <line x1="165" y1="170" x2="190" y2="170" stroke="#e65100" stroke-width="4"/>
      <line x1="0" y1="215" x2="200" y2="215" stroke="#333" stroke-width="5"/>
    </svg>
    <figcaption>1. Line and Circle</figcaption>
  </figure>

  <!-- 2. Circle and Rectangle: Traffic light -->
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <rect width="200" height="300" fill="#dff3ff"/>
      <rect x="90" y="220" width="20" height="80" fill="#555"/>
      <rect x="55" y="30" width="90" height="195" rx="12" fill="#222"/>
      <circle cx="100" cy="75" r="26" fill="#e53935"/>
      <circle cx="100" cy="128" r="26" fill="#fdd835"/>
      <circle cx="100" cy="181" r="26" fill="#43a047"/>
    </svg>
    <figcaption>2. Circle and Rectangle</figcaption>
  </figure>

  <!-- 3. Polyline and Circle: Trail with moon and stops -->
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <rect width="200" height="300" fill="#1b2340"/>
      <circle cx="150" cy="55" r="28" fill="#fff6c8"/>
      <circle cx="160" cy="48" r="24" fill="#1b2340"/>
      <polyline points="20,270 60,200 95,225 130,150 165,175 185,100"
                fill="none" stroke="#4dd0e1" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="20" cy="270" r="7" fill="#ff7043"/>
      <circle cx="60" cy="200" r="7" fill="#ff7043"/>
      <circle cx="95" cy="225" r="7" fill="#ff7043"/>
      <circle cx="130" cy="150" r="7" fill="#ff7043"/>
      <circle cx="165" cy="175" r="7" fill="#ff7043"/>
      <circle cx="185" cy="100" r="7" fill="#ffd54f"/>
    </svg>
    <figcaption>3. Polyline and Circle</figcaption>
  </figure>

  <!-- 4. Polygon and Ellipse: Fish -->
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <rect width="200" height="300" fill="#b3e5fc"/>
      <polygon points="150,150 195,115 195,185" fill="#ef6c00"/>
      <ellipse cx="95" cy="150" rx="65" ry="38" fill="#ff9800"/>
      <polygon points="80,115 105,85 120,118" fill="#ef6c00"/>
      <polygon points="80,185 105,215 120,182" fill="#ef6c00"/>
      <ellipse cx="60" cy="140" rx="9" ry="11" fill="#fff"/>
      <ellipse cx="58" cy="141" rx="4" ry="5" fill="#000"/>
      <ellipse cx="100" cy="270" rx="70" ry="14" fill="#c8a97a"/>
    </svg>
    <figcaption>4. Polygon and Ellipse</figcaption>
  </figure>

  <!-- 5. Circle, Line and Rectangle: Street lamp -->
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <rect width="200" height="300" fill="#2c3e50"/>
      <circle cx="100" cy="70" r="55" fill="#fff59d" opacity="0.35"/>
      <circle cx="100" cy="70" r="28" fill="#fff176" stroke="#fbc02d" stroke-width="3"/>
      <line x1="100" y1="98" x2="100" y2="250" stroke="#bdc3c7" stroke-width="8"/>
      <line x1="60" y1="115" x2="100" y2="140" stroke="#bdc3c7" stroke-width="4"/>
      <line x1="140" y1="115" x2="100" y2="140" stroke="#bdc3c7" stroke-width="4"/>
      <rect x="75" y="250" width="50" height="14" fill="#95a5a6"/>
      <rect x="0" y="264" width="200" height="36" fill="#1a252f"/>
    </svg>
    <figcaption>5. Circle, Line and Rectangle</figcaption>
  </figure>

  <!-- 6. Polyline and Polygon: Pine trees and mountain -->
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <rect width="200" height="300" fill="#e3f2fd"/>
      <polygon points="0,200 70,90 140,200" fill="#78909c"/>
      <polygon points="70,90 55,115 70,108 85,118" fill="#fff"/>
      <polygon points="50,280 50,250 30,250 60,205 40,205 70,150 100,205 80,205 110,250 90,250 90,280" fill="#2e7d32"/>
      <polygon points="140,285 160,235 150,235 170,190 190,235 180,235 195,285" fill="#388e3c"/>
      <polyline points="0,290 25,270 55,290 90,268 130,290 165,272 200,290"
                fill="none" stroke="#5d4037" stroke-width="4" stroke-linejoin="round"/>
    </svg>
    <figcaption>6. Polyline and Polygon</figcaption>
  </figure>

  <!-- 7. Circle, Rectangle, Polyline, Polygon and Ellipse: House scene -->
  <figure>
    <svg width="200" height="300" viewBox="0 0 200 300">
      <rect width="200" height="300" fill="#bbdefb"/>
      <circle cx="165" cy="40" r="22" fill="#ffca28"/>
      <ellipse cx="55" cy="50" rx="38" ry="15" fill="#fff"/>
      <ellipse cx="80" cy="42" rx="25" ry="12" fill="#fff"/>
      <rect x="0" y="230" width="200" height="70" fill="#66bb6a"/>
      <rect x="40" y="150" width="120" height="100" fill="#ffcc80" stroke="#8d6e63" stroke-width="3"/>
      <polygon points="30,150 100,90 170,150" fill="#c62828"/>
      <rect x="88" y="195" width="26" height="55" fill="#6d4c41"/>
      <rect x="52" y="170" width="24" height="24" fill="#81d4fa" stroke="#333" stroke-width="2"/>
      <rect x="126" y="170" width="24" height="24" fill="#81d4fa" stroke="#333" stroke-width="2"/>
      <circle cx="108" cy="224" r="2.5" fill="#ffd54f"/>
      <polyline points="101,250 90,268 115,280 95,298" fill="none" stroke="#a1887f" stroke-width="5" stroke-linejoin="round"/>
    </svg>
    <figcaption>7. Circle, Rectangle, Polyline, Polygon and Ellipse</figcaption>
  </figure>

</div>
</body>
</html>
